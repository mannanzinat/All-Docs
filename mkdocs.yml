# Project information
site_name: Documentation
site_url:
site_author: SpaGreen Creative
site_description: >-
 Rapiwa provides a powerful and low cost WhatsApp API for developers to integrate messaging, automation into their applications.

# Repository
repo_name:
repo_url:

# Copyright
copyright: Copyright &copy; 2019 - 2025 SpaGreen Creative

# Configuration
theme:
  name: material
  custom_dir: material/.overrides
  features:
    - navigation.footer
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
#    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
#    - search.highlight
#    - search.share
#    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
  - scheme: slate
    primary: blue
    toggle:
      default: true
      icon: material/weather-sunny
      name: Switch to light mode

  - scheme: light
    primary: light blue
    toggle:
      icon: material/weather-night
      name: Switch to dark mode

  font:
    text: Outfit
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: assets/logo.png

# Plugins
plugins:
  - glightbox:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Hooks
hooks:
  - material/.overrides/hooks/translations.py

# Customization
extra:
  annotate:
    json: [.s2]
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/spagreen/
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/spagreencreative
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@spagreen

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Getting started:
    - Introducing: getting-started.md
  - API Key:
    - API Key: api/api-key.md
  - Sessions:
    - Get WhatsApp Session QR Code: api/sessions.md
    - Session User Info: api/session-user-info.md
    - Session Logout: api/session-logout.md
  - Messages:
    - Send Text Message: api/send-text-message.md
    - Send Image Message: api/send-image-message.md
    - Send Video Message: api/send-video-message.md
    - Send Document Message: api/send-document-message.md
    - Send Audio Message: api/send-audio-message.md
    - Send Location: api/send-location.md
    - Send Quoted Message: api/send-quoted-message.md
    - Delete a Message: api/delete-a-message.md
    - Send Bulk Message: api/send-bulk-message.md

